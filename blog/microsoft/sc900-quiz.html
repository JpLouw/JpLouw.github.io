// ---------- helpers ----------
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const STORAGE_KEY = "sc900:progress:v1";

const defaultProgress = () => ({
  domainStats: Object.keys(DOMAINS).reduce((acc, d) => {
    acc[d] = { seen: 0, correct: 0 };
    return acc;
  }, {}),
  mockHistory: [],
});

// ---------- grading per question type ----------
function isCorrect(q, response) {
  if (!response) return false;
  if (q.type === "mcq") {
    const correctIds = q.options.map((o, i) => (o.correct ? i : null)).filter((i) => i !== null);
    const sel = response.selected || [];
    if (sel.length !== correctIds.length) return false;
    return correctIds.every((i) => sel.includes(i));
  }
  if (q.type === "tf") {
    const ans = response.answers || {};
    return q.statements.every((s, i) => ans[i] === s.answer);
  }
  if (q.type === "match") {
    const picks = response.picks || {};
    return q.pairs.every((p, i) => picks[i] === p.right);
  }
  if (q.type === "order") {
    const seq = response.sequence || [];
    return q.items.every((item, i) => seq[i] === item);
  }
  return false;
}

// ================= App =================
function App() {
  const [screen, setScreen] = useState("menu"); // menu | quiz | results
  const [mode, setMode] = useState("practice"); // practice | mock
  const [activeDomains, setActiveDomains] = useState(new Set(Object.keys(DOMAINS)));
  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [responses, setResponses] = useState({}); // qid -> response
  const [checked, setChecked] = useState({}); // qid -> bool (has been checked)
  const [progress, setProgress] = useState(defaultProgress());
  const [loadedStorage, setLoadedStorage] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage?.get(STORAGE_KEY, false);
        if (res?.value) {
          const parsed = JSON.parse(res.value);
          setProgress({ ...defaultProgress(), ...parsed });
        }
      } catch (e) {
        // no saved progress yet
      } finally {
        setLoadedStorage(true);
      }
    })();
  }, []);

  const saveProgress = useCallback(async (next) => {
    setProgress(next);
    try {
      await window.storage?.set(STORAGE_KEY, JSON.stringify(next), false);
    } catch (e) {
      // ignore storage failures — session still works in memory
    }
  }, []);

  const filteredPool = useMemo(
    () => QUESTIONS.filter((q) => activeDomains.has(q.domain)),
    [activeDomains]
  );

  const toggleDomain = (d) => {
    setActiveDomains((prev) => {
      const next = new Set(prev);
      if (next.has(d)) {
        if (next.size > 1) next.delete(d);
      } else next.add(d);
      return next;
    });
  };

  const startRun = (m) => {
    setMode(m);
    const pool = shuffle(filteredPool);
    const size = m === "mock" ? Math.min(40, pool.length) : pool.length;
    setQueue(pool.slice(0, size).map((q) => q.id));
    setIdx(0);
    setResponses({});
    setChecked({});
    setScreen("quiz");
  };

  const currentQ = useMemo(
    () => QUESTIONS.find((q) => q.id === queue[idx]),
    [queue, idx]
  );

  const setResponse = (qid, resp) => {
    setResponses((prev) => ({ ...prev, [qid]: resp }));
  };

  const handleCheck = () => {
    if (!currentQ) return;
    const resp = responses[currentQ.id];
    const correct = isCorrect(currentQ, resp);
    setChecked((prev) => ({ ...prev, [currentQ.id]: true }));
    const next = {
      ...progress,
      domainStats: {
        ...progress.domainStats,
        [currentQ.domain]: {
          seen: (progress.domainStats[currentQ.domain]?.seen || 0) + 1,
          correct: (progress.domainStats[currentQ.domain]?.correct || 0) + (correct ? 1 : 0),
        },
      },
    };
    saveProgress(next);
  };

  const handleNext = () => {
    if (idx + 1 < queue.length) {
      setIdx(idx + 1);
    } else if (mode === "mock") {
      finishMock();
    } else {
      setScreen("menu");
    }
  };

  const finishMock = () => {
    const total = queue.length;
    const domainStats = { ...progress.domainStats };
    let correctCount = 0;
    queue.forEach((qid) => {
      const q = QUESTIONS.find((qq) => qq.id === qid);
      const ok = isCorrect(q, responses[qid]);
      if (ok) correctCount++;
      domainStats[q.domain] = {
        seen: (domainStats[q.domain]?.seen || 0) + 1,
        correct: (domainStats[q.domain]?.correct || 0) + (ok ? 1 : 0),
      };
    });
    const record = { date: new Date().toISOString(), score: correctCount, total };
    const next = { ...progress, domainStats, mockHistory: [record, ...progress.mockHistory].slice(0, 20) };
    saveProgress(next);
    setScreen("results");
  };

  const overallStats = useMemo(() => {
    let seen = 0, correct = 0;
    Object.values(progress.domainStats).forEach((s) => { seen += s.seen; correct += s.correct; });
    return { seen, correct, pct: seen ? Math.round((correct / seen) * 100) : 0 };
  }, [progress]);

  return (
    <div style={styles.appShell}>
      <style>{globalCss}</style>
      <TopBar overallStats={overallStats} />
      {screen === "menu" && (
        <MenuScreen
          activeDomains={activeDomains}
          toggleDomain={toggleDomain}
          filteredCount={filteredPool.length}
          progress={progress}
          onStart={startRun}
        />
      )}
      {screen === "quiz" && currentQ && (
        <QuizScreen
          q={currentQ}
          index={idx}
          total={queue.length}
          mode={mode}
          response={responses[currentQ.id]}
          setResponse={(r) => setResponse(currentQ.id, r)}
          isChecked={mode === "practice" ? !!checked[currentQ.id] : false}
          onCheck={mode === "practice" ? handleCheck : undefined}
          onNext={handleNext}
          showFeedback={mode === "practice"}
          onExit={() => setScreen("menu")}
        />
      )}
      {screen === "results" && (
        <ResultsScreen
          queue={queue}
          responses={responses}
          onRestart={() => setScreen("menu")}
        />
      )}
    </div>
  );
}

// ---------- Top bar ----------
function TopBar({ overallStats }) {
  return (
    <div style={styles.topBar}>
      <div style={styles.brand}>
        <Radar size={20} color="#5EEAD4" strokeWidth={2.2} />
        <div>
          <div style={styles.brandTitle}>SC-900 CONSOLE</div>
          <div style={styles.brandSub}>Security · Compliance · Identity Fundamentals</div>
        </div>
      </div>
      <div style={styles.gaugeWrap}>
        <Gauge pct={overallStats.pct} />
        <div style={styles.gaugeText}>
          <div style={styles.gaugePct}>{overallStats.pct}%</div>
          <div style={styles.gaugeLabel}>{overallStats.correct}/{overallStats.seen} lifetime</div>
        </div>
      </div>
    </div>
  );
}

function Gauge({ pct }) {
  const r = 20, c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  const color = pct >= 80 ? "#5EEAD4" : pct >= 50 ? "#FDE68A" : "#FCA5A5";
  return (
    <svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r={r} fill="none" stroke="#1E2733" strokeWidth="5" />
      <circle
        cx="26" cy="26" r={r} fill="none" stroke={color} strokeWidth="5"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform="rotate(-90 26 26)" style={{ transition: "stroke-dashoffset 0.6s ease" }}
      />
    </svg>
  );
}

          <Play size={18} /> Practice mode ({filteredCount} questions)
        </button>
        <button style={{ ...styles.bigBtn, ...styles.bigBtnAlt }} onClick={() => onStart("mock")}>
          <Target size={18} /> Mock exam ({Math.min(40, filteredCount)} questions)
        </button>
      </div>

      {progress.mockHistory.length > 0 && (
        <div style={styles.historyBox}>
          <div style={styles.historyTitle}><ListChecks size={14} /> Recent mock exams</div>
          {progress.mockHistory.slice(0, 5).map((h, i) => (
            <div key={i} style={styles.historyRow}>
              <span>{new Date(h.date).toLocaleDateString()}</span>
              <span style={{ color: h.score / h.total >= 0.7 ? "#5EEAD4" : "#FCA5A5" }}>
                {h.score}/{h.total} ({Math.round((h.score / h.total) * 100)}%)
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- Quiz screen ----------
function QuizScreen({ q, index, total, mode, response, setResponse, isChecked, onCheck, onNext, showFeedback, onExit }) {
  const d = DOMAINS[q.domain];
  const correct = isChecked ? isCorrect(q, response) : null;

  return (
    <div style={styles.quizWrap}>
      <div style={styles.quizTopRow}>
        <button style={styles.exitBtn} onClick={onExit}><ChevronLeft size={16} /> Menu</button>
        <div style={styles.progressBarOuter}>
          <div style={{ ...styles.progressBarInner, width: `${((index) / total) * 100}%` }} />
        </div>
        <div style={styles.qCounter}>{index + 1} / {total}</div>
      </div>

      <div style={{ ...styles.domainTag, color: d.color, borderColor: d.color }}>
        {d.label}
      </div>

      <div style={styles.card}>
        <div style={styles.prompt}>{q.prompt}</div>
        {q.type === "mcq" && q.selectN > 1 && (
          <div style={styles.hint}>Select {q.selectN} answers</div>
        )}

        {q.type === "mcq" && (
          <McqBlock key={q.id} q={q} response={response} setResponse={setResponse} checked={isChecked && showFeedback} revealAll={isChecked} />
        )}
        {q.type === "tf" && (
          <TfBlock key={q.id} q={q} response={response} setResponse={setResponse} checked={isChecked && showFeedback} revealAll={isChecked} />
        )}
        {q.type === "match" && (
          <MatchBlock key={q.id} q={q} response={response} setResponse={setResponse} checked={isChecked && showFeedback} revealAll={isChecked} />
        )}
        {q.type === "order" && (
          <OrderBlock key={q.id} q={q} response={response} setResponse={setResponse} checked={isChecked && showFeedback} revealAll={isChecked} />
        )}

        {isChecked && showFeedback && (
          <div style={{ ...styles.feedbackBox, borderColor: correct ? "#5EEAD4" : "#FCA5A5" }}>
            <div style={{ ...styles.feedbackHead, color: correct ? "#5EEAD4" : "#FCA5A5" }}>
              {correct ? <ShieldCheck size={16} /> : <ShieldAlert size={16} />}
              {correct ? "Correct" : "Not quite"}
            </div>
            <div style={styles.feedbackText}>{q.explanation}</div>
          </div>
        )}
        {isChecked && !showFeedback && (
          <div style={styles.feedbackBoxQuiet}>Answer locked in. Move to the next question — full explanations appear in the review at the end.</div>
        )}
      </div>

      <div style={styles.actionsRow}>
        {showFeedback && !isChecked && (
          <button style={{ ...styles.bigBtn, ...styles.bigBtnPrimary }} onClick={onCheck} disabled={!response}>
            <Check size={18} /> Check answer
          </button>
        )}
        {(isChecked || !showFeedback) && (
          <button style={{ ...styles.bigBtn, ...styles.bigBtnAlt }} onClick={onNext}>
            {index + 1 < total ? "Next question" : "Finish"} <ChevronRight size={18} />
          </button>
        )}
      </div>
    </div>
  );
}

// ---------- MCQ block ----------
function McqBlock({ q, response, setResponse, checked, revealAll }) {
  const sel = response?.selected || [];
  const toggle = (i) => {
    if (checked) return;
    let next;
    if (q.selectN === 1) {
      next = [i];
    } else {
      next = sel.includes(i) ? sel.filter((x) => x !== i) : [...sel, i];
    }
    setResponse({ selected: next });
  };

  return (
    <div style={styles.optionList}>
      {q.options.map((opt, i) => {
        const isSel = sel.includes(i);
        let borderColor = "#2A3441";
        let bg = "transparent";
        if (revealAll) {
          if (opt.correct) { borderColor = "#5EEAD4"; bg = "#5EEAD414"; }
          else if (isSel && !opt.correct) { borderColor = "#FCA5A5"; bg = "#FCA5A514"; }
        } else if (isSel) {
          borderColor = "#8FA3B8"; bg = "#8FA3B814";
        }
        return (
          <div key={i}>
            <button
              style={{ ...styles.option, borderColor, background: bg }}
              onClick={() => toggle(i)}
              disabled={revealAll}
            >
              <span style={{
                ...styles.optionMark,
                borderColor: isSel ? "#E6EDF3" : "#3A4451",
                background: isSel ? "#E6EDF3" : "transparent",
                borderRadius: q.selectN === 1 ? "50%" : "4px",
              }}>
                {isSel && <span style={{ color: "#0B0F14", fontSize: 11, fontWeight: 700 }}>✓</span>}
              </span>
              <span style={styles.optionText}>{opt.text}</span>
              {revealAll && opt.correct && <Check size={16} color="#5EEAD4" />}
              {revealAll && isSel && !opt.correct && <X size={16} color="#FCA5A5" />}
            </button>
            {revealAll && (opt.correct || isSel) && (
              <div style={styles.optionWhy}>{opt.why}</div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---------- True/False block ----------
function TfBlock({ q, response, setResponse, checked, revealAll }) {
  const ans = response?.answers || {};
  const set = (i, val) => {
    if (checked) return;
    setResponse({ answers: { ...ans, [i]: val } });
  };
  return (
    <div style={styles.tfList}>
      {q.statements.map((s, i) => {
        const userVal = ans[i];
        const isRight = revealAll && userVal === s.answer;
        const isWrong = revealAll && userVal !== undefined && userVal !== s.answer;
        return (
          <div key={i} style={styles.tfRow}>
            <div style={styles.tfText}>{s.text}</div>
            <div style={styles.tfButtons}>
              {[true, false].map((v) => {
                const label = v ? "True" : "False";
                const active = userVal === v;
                let color = "#6B7684", border = "#2A3441";
                if (active && !revealAll) { color = "#E6EDF3"; border = "#8FA3B8"; }
                if (revealAll && v === s.answer) { color = "#5EEAD4"; border = "#5EEAD4"; }
                if (revealAll && active && v !== s.answer) { color = "#FCA5A5"; border = "#FCA5A5"; }
                return (
                  <button key={label} onClick={() => set(i, v)} disabled={revealAll}
                    style={{ ...styles.tfBtn, color, borderColor: border }}>
                    {label}
                  </button>
                );
              })}
            </div>
            {revealAll && <div style={styles.optionWhy}>{s.why}</div>}
          </div>
        );
      })}
    </div>
  );
}

// ---------- Match block ----------
function MatchBlock({ q, response, setResponse, checked, revealAll }) {
  const rightOptions = useMemo(() => shuffle(q.pairs.map((p) => p.right)), [q]);
  const picks = response?.picks || {};
  const setPick = (i, val) => {
    if (checked) return;
    setResponse({ picks: { ...picks, [i]: val } });
  };
  return (
    <div style={styles.matchList}>
      {q.pairs.map((p, i) => {
        const userPick = picks[i];
        const right = revealAll && userPick === p.right ? "#5EEAD4" : revealAll && userPick ? "#FCA5A5" : "#2A3441";
        return (
          <div key={i} style={styles.matchRow}>
            <div style={styles.matchLeft}>{p.left}</div>
            <select
              value={userPick || ""}
              disabled={revealAll}
              onChange={(e) => setPick(i, e.target.value)}
              style={{ ...styles.matchSelect, borderColor: right }}
            >
              <option value="" disabled>Choose a match…</option>
              {rightOptions.map((r, ri) => <option key={ri} value={r}>{r}</option>)}
            </select>
            {revealAll && userPick !== p.right && (
              <div style={styles.correctAnswerNote}>Correct: {p.right}</div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---------- Order block ----------
function OrderBlock({ q, response, setResponse, checked, revealAll }) {
  const initial = response?.sequence || shuffle(q.items);
  const [seq, setSeq] = useState(initial);
  useEffect(() => {
    if (!response) setResponse({ sequence: initial });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  const move = (i, dir) => {
    if (checked) return;
    const next = [...seq];
    const j = i + dir;
    if (j < 0 || j >= next.length) return;
    [next[i], next[j]] = [next[j], next[i]];
    setSeq(next);
    setResponse({ sequence: next });
  };
  return (
    <div style={styles.orderList}>
      {seq.map((item, i) => {
        const isRight = revealAll && q.items[i] === item;
        return (
          <div key={item} style={{ ...styles.orderRow, borderColor: revealAll ? (isRight ? "#5EEAD4" : "#FCA5A5") : "#2A3441" }}>
            <span style={styles.orderIndex}>{i + 1}</span>
            <span style={styles.orderText}>{item}</span>
            {!revealAll && (
              <div style={styles.orderArrows}>
                <button style={styles.orderArrowBtn} onClick={() => move(i, -1)}><ArrowUp size={14} /></button>
                <button style={styles.orderArrowBtn} onClick={() => move(i, 1)}><ArrowDown size={14} /></button>
              </div>
            )}
          </div>
        );
      })}
      {revealAll && (
        <div style={styles.correctAnswerNote}>Correct order: {q.items.join(" → ")}</div>
      )}
    </div>
  );
}

// ---------- Results (mock exam review) ----------
function ResultsScreen({ queue, responses, onRestart }) {
  const items = queue.map((qid) => QUESTIONS.find((q) => q.id === qid));
  const correctCount = items.filter((q) => isCorrect(q, responses[q.id])).length;
  const pct = Math.round((correctCount / items.length) * 100);

  return (
    <div style={styles.menuWrap}>
      <div style={styles.menuHeader}>
        <h1 style={styles.h1}>Mock exam debrief</h1>
        <p style={styles.sub}>
          Score: <strong style={{ color: pct >= 70 ? "#5EEAD4" : "#FCA5A5" }}>{correctCount}/{items.length} ({pct}%)</strong> — passing benchmark for SC-900 is roughly 700/1000, similar to ~70%.
        </p>
      </div>

      <div style={styles.reviewList}>
        {items.map((q, i) => {
          const correct = isCorrect(q, responses[q.id]);
          const d = DOMAINS[q.domain];
          return (
            <div key={q.id} style={{ ...styles.reviewCard, borderLeft: `4px solid ${correct ? "#5EEAD4" : "#FCA5A5"}` }}>
              <div style={styles.reviewHead}>
                <span style={{ ...styles.domainTagSmall, color: d.color, borderColor: d.color }}>{d.label}</span>
                {correct ? <Check size={16} color="#5EEAD4" /> : <X size={16} color="#FCA5A5" />}
              </div>
              <div style={styles.reviewPrompt}>{i + 1}. {q.prompt}</div>
              <div style={styles.reviewExplain}>{q.explanation}</div>
            </div>
          );
        })}
      </div>

      <div style={styles.actionsRow}>
        <button style={{ ...styles.bigBtn, ...styles.bigBtnPrimary }} onClick={onRestart}>
          <RotateCcw size={18} /> Back to menu
        </button>
      </div>
    </div>
  );
}
