// ================= layout helpers =================
const RADIUS = 220;
const CENTER = 260;

function nodePosition(index, total) {
  const angle = (index / total) * 2 * Math.PI - Math.PI / 2;
  return {
    x: CENTER + RADIUS * Math.cos(angle),
    y: CENTER + RADIUS * Math.sin(angle),
  };
}

function coverageRatio(cat) {
  const covered = cat.items.filter((i) => i.sc900).length;
  return { covered, total: cat.items.length };
}

// ================= App =================
function App() {
  const [activeId, setActiveId] = useState(null);
  const [sc900Only, setSc900Only] = useState(false);
  const [showSources, setShowSources] = useState(false);
  const [expandedItem, setExpandedItem] = useState(null);

  const active = useMemo(() => CATEGORIES.find((c) => c.id === activeId) || null, [activeId]);

  const selectCategory = (id) => {
    setActiveId(activeId === id ? null : id);
    setExpandedItem(null);
  };

  return (
    <div style={s.shell}>
      <style>{css}</style>

      <div style={s.header}>
        <div style={s.headerLeft}>
          <Shield size={20} color="#5EEAD4" strokeWidth={2.2} />
          <div>
            <div style={s.title}>MICROSOFT SECURITY ECOSYSTEM</div>
            <div style={s.subtitle}>An interactive map of the suite — and what SC-900 actually covers</div>
          </div>
        </div>
        <button
          style={{ ...s.filterBtn, ...(sc900Only ? s.filterBtnActive : {}) }}
          onClick={() => setSc900Only((v) => !v)}
        >
          <Filter size={14} /> {sc900Only ? "Showing SC-900 only" : "Show SC-900 only"}
        </button>
      </div>

      <div style={s.body}>
        <div style={s.mapWrap}>
          <svg viewBox="0 0 520 520" style={s.svg} role="img" aria-label="Mind map of Microsoft security products">
            {CATEGORIES.map((cat, i) => {
              const p = nodePosition(i, CATEGORIES.length);
              const dim = sc900Only && coverageRatio(cat).covered === 0;
              return (
                <line
                  key={`line-${cat.id}`}
                  x1={CENTER} y1={CENTER} x2={p.x} y2={p.y}
                  stroke={dim ? "#1B2531" : cat.color}
                  strokeOpacity={dim ? 0.3 : activeId && activeId !== cat.id ? 0.25 : 0.55}
                  strokeWidth={activeId === cat.id ? 2.5 : 1.5}
                />
              );
            })}

            <circle cx={CENTER} cy={CENTER} r={46} fill="#111820" stroke="#2A3441" strokeWidth={1.5} />
            <text x={CENTER} y={CENTER - 6} textAnchor="middle" style={s.hubTitle}>MS</text>
            <text x={CENTER} y={CENTER + 12} textAnchor="middle" style={s.hubSub}>SECURITY</text>

            {CATEGORIES.map((cat, i) => {
              const p = nodePosition(i, CATEGORIES.length);
              const { covered, total } = coverageRatio(cat);
              const dim = sc900Only && covered === 0;
              const isActive = activeId === cat.id;
              return (
                <g
                  key={cat.id}
                  transform={`translate(${p.x}, ${p.y})`}
                  onClick={() => selectCategory(cat.id)}
                  style={{ cursor: "pointer" }}
                >
                  <circle
                    r={isActive ? 34 : 30}
                    fill={dim ? "#161D26" : `${cat.color}22`}
                    stroke={dim ? "#2A3441" : cat.color}
                    strokeWidth={isActive ? 2.5 : 1.5}
                    style={{ transition: "all 0.2s ease" }}
                  />
                  <text y={-2} textAnchor="middle" style={{ ...s.nodeLabel, fill: dim ? "#4A5563" : "#E6EDF3" }}>
                    {cat.short}
                  </text>
                  <text y={14} textAnchor="middle" style={{ ...s.nodeCount, fill: dim ? "#3A4451" : cat.color }}>
                    {covered}/{total}
                  </text>
                </g>
              );
            })}
          </svg>
          <div style={s.mapHint}>{active ? "Tap the node again to close, or pick another." : "Tap any node to explore what's inside."}</div>
        </div>

        <div style={s.panel}>
          {!active && (
            <div style={s.panelEmpty}>
              <Sparkles size={22} color="#5EEAD4" />
              <div style={s.panelEmptyTitle}>Pick a branch to explore</div>
              <p style={s.panelEmptyText}>
                Each node is a Microsoft security product family. The number under its name is
                <strong> covered / total</strong> — how many of its parts show up on the SC-900 exam versus the
                broader portfolio. Tap an item inside a branch to expand its full detail.
              </p>
              <div style={s.legendRow}>
                <span style={s.legendItem}><CheckCircle2 size={14} color="#5EEAD4" /> On the SC-900 exam</span>
                <span style={s.legendItem}><Circle size={14} color="#6B7684" /> Broader portfolio, not on SC-900</span>
              </div>
            </div>
          )}

          {active && (
            <div>
              <div style={{ ...s.panelHead, borderColor: active.color }}>
                <div>
                  <div style={{ ...s.panelTag, color: active.color, borderColor: active.color }}>{active.label}</div>
                  <p style={s.panelBlurb}>{active.blurb}</p>
                </div>
                <button style={s.closeBtn} onClick={() => selectCategory(active.id)}><X size={16} /></button>
              </div>

              <div style={s.itemList}>
                {active.items
                  .filter((it) => !sc900Only || it.sc900)
                  .map((it, i) => {
                    const key = `${active.id}-${i}`;
                    const isOpen = expandedItem === key;
                    const hasPoints = it.points && it.points.length > 0;
                    return (
                      <div
                        key={key}
                        style={{ ...s.itemCard, borderLeft: `3px solid ${it.sc900 ? active.color : "#2A3441"}` }}
                        onClick={() => hasPoints && setExpandedItem(isOpen ? null : key)}
                      >
                        <div style={s.itemHead}>
                          <span style={s.itemName}>{it.name}</span>
                          {it.sc900 ? (
                            <span style={{ ...s.badge, color: "#5EEAD4", borderColor: "#5EEAD4" }}>
                              <CheckCircle2 size={12} /> SC-900
                            </span>
                          ) : (
                            <span style={{ ...s.badge, color: "#6B7684", borderColor: "#2A3441" }}>
                              <Circle size={12} /> Broader portfolio
                            </span>
                          )}
                        </div>
                        <div style={s.itemDesc}>{it.desc}</div>
                        {it.status && (
                          <div style={s.statusNote}><AlertTriangle size={12} /> {it.status}</div>
                        )}
                        {hasPoints && (
                          <div style={s.expandHint}>{isOpen ? "Show less ▲" : `Show ${it.points.length} key point${it.points.length > 1 ? "s" : ""} ▾`}</div>
                        )}
                        {isOpen && hasPoints && (
                          <ul style={s.pointsList}>
                            {it.points.map((pt, pi) => (
                              <li key={pi} style={s.pointItem}>{pt}</li>
                            ))}
                          </ul>
                        )}
                      </div>
                    );
                  })}
              </div>
            </div>
          )}
        </div>
      </div>

      <div style={s.footer}>
        <button style={s.sourcesBtn} onClick={() => setShowSources((v) => !v)}>
          <Info size={13} /> Sources & accuracy notes
        </button>
        {showSources && (
          <div style={s.sourcesBox}>
            <div style={s.sourcesTitle}>Checked against, current as of Aug 2026:</div>
            <ul style={s.sourcesList}>
              {SOURCES.map((src, i) => <li key={i}>{src}</li>)}
            </ul>
            <div style={s.sourcesNote}>
              Two portfolio changes are called out directly on their nodes: Microsoft Entra Permissions Management
              retired Nov 1, 2025 (capabilities moved into Defender for Cloud CSPM), and Microsoft Defender Threat
              Intelligence's standalone product retired Aug 1, 2026 (converged into Defender XDR and Sentinel).
              If anything here looks off or has changed since, it's worth cross-checking learn.microsoft.com directly —
              Microsoft's security portfolio moves fast.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
