// SC-900 Glossary & Confusable Terms — reference data
// Domains match the other apps in this set: concepts | entra | security | compliance

  concepts: { label: "Concepts", color: "#5EEAD4" },

// ---------------- GLOSSARY ----------------
// Each term: id, domain, definition, and an optional "watch" one-liner
// flagging the specific mix-up to avoid (kept short — the full contrast lives in CONFUSION_PAIRS).
const GLOSSARY = [
  // ===== concepts =====
  { id: "zero-trust", domain: "concepts", term: "Zero Trust", definition: "A security strategy built on three principles: verify explicitly, use least privileged access, and assume breach. It replaces the old \"trust anything inside the network perimeter\" model with continuous verification of every request.", watch: "Not a product — it's a strategy Entra, Defender, and Sentinel all implement." },
  { id: "verify-explicitly", domain: "concepts", term: "Verify explicitly", definition: "One of the three Zero Trust principles: always authenticate and authorize based on all available signals (user, location, device, service, workload), not just \"they're on the network.\"" },
  { id: "least-privilege", domain: "concepts", term: "Least privileged access", definition: "One of the three Zero Trust principles: limit user access with just-in-time and just-enough-access (JIT/JEA), risk-based adaptive policies, and data protection." },
  { id: "assume-breach", domain: "concepts", term: "Assume breach", definition: "One of the three Zero Trust principles: operate as if an attacker is already inside. Drives segmentation, end-to-end encryption, analytics, and rapid detection/response to limit blast radius." },
  { id: "shared-responsibility", domain: "concepts", term: "Shared responsibility model", definition: "Defines which security tasks fall to the cloud provider and which stay with the customer. The split shifts as you move from IaaS → PaaS → SaaS: the provider takes on more (hardware, OS, and eventually most of the app stack), but the customer never stops owning data, identities, and endpoint devices." },
  { id: "defense-in-depth", domain: "concepts", term: "Defense in depth", definition: "A layered security strategy: physical security → identity & access → perimeter → network → compute → application → data. Each layer is a fallback if an earlier one fails." },
  { id: "cia-triad", domain: "concepts", term: "CIA triad", definition: "Confidentiality (only authorized people see data), Integrity (data isn't tampered with), Availability (systems and data are accessible when needed) — the three goals most security controls exist to protect." },
  { id: "symmetric-encryption", domain: "concepts", term: "Symmetric encryption", definition: "Uses one shared key for both encrypting and decrypting data. Fast, but the key must be distributed securely to everyone who needs it." },
  { id: "asymmetric-encryption", domain: "concepts", term: "Asymmetric encryption", definition: "Uses a public/private key pair — data encrypted with one key can only be decrypted with the other. Solves the key-distribution problem symmetric encryption has, at the cost of speed." },
  { id: "hashing", domain: "concepts", term: "Hashing", definition: "A one-way function that converts input into a fixed-length value. Used to verify data hasn't changed (integrity) or to store passwords without ever storing the plaintext. It cannot be reversed." },
  { id: "salting", domain: "concepts", term: "Salting", definition: "Adding a random value to input before hashing, so identical inputs (like two users with the same password) produce different hashes — defeats precomputed \"rainbow table\" attacks." },
  { id: "data-residency", domain: "concepts", term: "Data residency", definition: "Where data is physically stored or processed — often dictated by law (e.g., a regulation requiring citizens' data to stay within national borders)." },
  { id: "data-sovereignty", domain: "concepts", term: "Data sovereignty", definition: "Whose laws govern the data, based on where it resides. Data stored in France is subject to French/EU law regardless of where the company that owns it is headquartered." },
  { id: "non-repudiation", domain: "concepts", term: "Non-repudiation", definition: "Ensures a sender cannot later deny having sent a message or performed an action — typically achieved through digital signatures and audit trails." },
  { id: "federation", domain: "concepts", term: "Federation", definition: "A trust relationship between identity providers that lets a user authenticate once with their home provider and access a partner's resources, without a separate account or login." },
  { id: "authentication", domain: "concepts", term: "Authentication (AuthN)", definition: "Proves who an identity is — a user, device, or app — usually via something you know, have, or are. Always happens before authorization." },
  { id: "authorization", domain: "concepts", term: "Authorization (AuthZ)", definition: "Determines what an already-authenticated identity is allowed to do or access. Runs after authentication succeeds." },
  { id: "identity", domain: "concepts", term: "Identity", definition: "The set of attributes that define a user, device, or application. Modern identity extends well beyond humans — a thermostat or a service account can have its own identity." },
  { id: "shift-left", domain: "concepts", term: "Shift-left (security)", definition: "Moving security earlier into the development lifecycle — hardening build/deploy pipelines rather than only defending production. Named because attackers now target CI/CD tooling directly." },

  // ===== entra =====
  { id: "entra-id", domain: "entra", term: "Microsoft Entra ID", definition: "Microsoft's cloud-based identity and access management service (formerly Azure AD). Handles authentication, SSO, Conditional Access, and MFA for users, devices, and apps." },
  { id: "tenant", domain: "entra", term: "Tenant", definition: "A dedicated instance of Entra ID for one organization. Every tenant has exactly one directory — the terms are often used interchangeably." },

  { id: "mfa", domain: "entra", term: "Multi-factor authentication (MFA)", definition: "Requires at least two of: something you know (password), something you have (phone, token), something you are (biometric) — before granting access." },

  { id: "access-reviews", domain: "entra", term: "Access reviews", definition: "Periodic, often manual check-ins asking \"does this person still need this access?\" Can be single- or multi-stage, and can auto-remove access if a reviewer doesn't respond." },
  { id: "pim", domain: "entra", term: "Privileged Identity Management (PIM)", definition: "Grants just-in-time, time-bound elevation to admin/privileged roles instead of standing access — reduces the attack surface of always-on admin accounts." },

  { id: "device-join", domain: "entra", term: "Entra joined / Entra hybrid joined / Entra registered", definition: "Joined = cloud-only, organization-owned and managed. Hybrid joined = exists in both on-prem AD and Entra ID. Registered = typically a personal/BYOD device with limited access." },

  { id: "nsg", domain: "security", term: "Network Security Group (NSG)", definition: "Layer 3/4 allow/deny rules applied to a subnet or network interface. Rules are evaluated in ascending priority order (lowest number first); default rules can't be deleted but can be overridden." },
  { id: "asg", domain: "security", term: "Application Security Group (ASG)", definition: "Lets you group VMs by logical role (e.g., \"web-tier\") so NSG rules apply to the group rather than individual IPs — simplifies rule management for multi-tier apps." },

// ================= App =================
function App() {
  const [tab, setTab] = useState("glossary"); // glossary | confused
  const [query, setQuery] = useState("");
  const [domainFilter, setDomainFilter] = useState(new Set(Object.keys(DOMAINS)));
  const [openPair, setOpenPair] = useState(null);
  const [openTerm, setOpenTerm] = useState(null);

  const toggleDomain = (d) => {
    setDomainFilter((prev) => {
      const next = new Set(prev);
      if (next.has(d)) {
        if (next.size > 1) next.delete(d);
      } else next.add(d);
      return next;
    });
  };

  const filteredGlossary = useMemo(() => {
    const q = query.trim().toLowerCase();
    return GLOSSARY.filter((t) => domainFilter.has(t.domain))
      .filter((t) => !q || t.term.toLowerCase().includes(q) || t.definition.toLowerCase().includes(q))
      .sort((a, b) => a.term.localeCompare(b.term));
  }, [query, domainFilter]);

  const filteredPairs = useMemo(() => {
    const q = query.trim().toLowerCase();
    return CONFUSION_PAIRS.filter((p) => domainFilter.has(p.domain))
      .filter((p) => !q || p.title.toLowerCase().includes(q) || p.items.some((i) => i.term.toLowerCase().includes(q)));
  }, [query, domainFilter]);

  return (
    <div style={s.shell}>
      <style>{css}</style>

      <div style={s.header}>
        <div style={s.headerLeft}>
          <Shield size={20} color="#5EEAD4" strokeWidth={2.2} />
          <div>
            <div style={s.title}>SC-900 TERM DECK</div>
            <div style={s.subtitle}>Glossary, and the pairs everyone mixes up</div>
          </div>
        </div>
        <div style={s.tabRow}>
          <button
            style={{ ...s.tabBtn, ...(tab === "glossary" ? s.tabBtnActive : {}) }}
            onClick={() => setTab("glossary")}
          >
            <BookOpen size={14} /> Glossary
          </button>
          <button
            style={{ ...s.tabBtn, ...(tab === "confused" ? s.tabBtnActive : {}) }}
            onClick={() => setTab("confused")}
          >
            <Shuffle size={14} /> Mix-ups
          </button>
        </div>
      </div>

      <div style={s.controls}>
        <div style={s.searchWrap}>
          <Search size={15} color="#6B7684" />
          <input
            style={s.searchInput}
            placeholder={tab === "glossary" ? "Search terms…" : "Search mix-ups…"}
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
          {query && (
            <button style={s.clearBtn} onClick={() => setQuery("")}><X size={13} /></button>
          )}
        </div>
        <div style={s.chipRow}>
          {Object.entries(DOMAINS).map(([key, d]) => {
            const active = domainFilter.has(key);
            return (
              <button
                key={key}
                onClick={() => toggleDomain(key)}
                style={{
                  ...s.chip,
                  borderColor: active ? d.color : "#2A3441",
                  color: active ? d.color : "#6B7684",
                  background: active ? `${d.color}14` : "transparent",
                }}
              >
                <span style={{ ...s.chipDot, background: active ? d.color : "#3A4451" }} />
                {d.label}
              </button>
            );
          })}
        </div>
      </div>

      {tab === "glossary" && (
        <div style={s.count}>{filteredGlossary.length} term{filteredGlossary.length === 1 ? "" : "s"}</div>
      )}
      {tab === "confused" && (
        <div style={s.count}>{filteredPairs.length} mix-up{filteredPairs.length === 1 ? "" : "s"}</div>
      )}

      {tab === "glossary" && (
        <div style={s.grid}>
          {filteredGlossary.map((t) => {
            const d = DOMAINS[t.domain];
            const isOpen = openTerm === t.id;
            return (
              <div key={t.id} style={{ ...s.termCard, borderLeft: `3px solid ${d.color}` }}
                onClick={() => setOpenTerm(isOpen ? null : t.id)}>
                <div style={s.termHead}>
                  <span style={s.termName}>{t.term}</span>
                  <span style={{ ...s.domainTagSmall, color: d.color, borderColor: d.color }}>{d.label}</span>
                </div>
                <div style={s.termDef}>{t.definition}</div>
                {t.watch && (
                  <div style={s.watchNote}><AlertTriangle size={12} /> {t.watch}</div>
                )}
              </div>
            );
          })}
          {filteredGlossary.length === 0 && (
            <div style={s.emptyState}>No terms match that search — try a different keyword or reset the domain filters.</div>
          )}
        </div>
      )}

      {tab === "confused" && (
        <div style={s.pairList}>
          {filteredPairs.map((p) => {
            const d = DOMAINS[p.domain];
            const isOpen = openPair === p.id;
            return (
              <div key={p.id} style={{ ...s.pairCard, borderColor: isOpen ? d.color : "#1B2531" }}>
                <button style={s.pairHeadBtn} onClick={() => setOpenPair(isOpen ? null : p.id)}>
                  <div style={s.pairHeadLeft}>
                    <span style={{ ...s.domainTagSmall, color: d.color, borderColor: d.color }}>{d.label}</span>
                    <span style={s.pairTitle}>{p.title}</span>
                  </div>
                  {isOpen ? <ChevronUp size={16} color="#6B7684" /> : <ChevronDown size={16} color="#6B7684" />}
                </button>

                {isOpen && (
                  <div style={s.pairBody}>
                    <div style={s.trapBox}>
                      <div style={s.trapLabel}><AlertTriangle size={13} color="#FCA5A5" /> The trap</div>
                      <div style={s.trapText}>{p.trap}</div>
                    </div>
                    <div style={s.tellBox}>
                      <div style={{ ...s.trapLabel, color: "#5EEAD4" }}>How to tell them apart</div>
                      <div style={s.trapText}>{p.tell}</div>
                    </div>
                    <div style={s.itemsGrid}>
                      {p.items.map((it, i) => (
                        <div key={i} style={s.itemBox}>
                          <div style={{ ...s.itemTerm, color: d.color }}>{it.term}</div>
                          <div style={s.itemNote}>{it.note}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          {filteredPairs.length === 0 && (
            <div style={s.emptyState}>No mix-ups match that search — try a different keyword or reset the domain filters.</div>
          )}
        </div>
      )}
    </div>
  );
}
